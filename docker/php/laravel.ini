; Laravel specific PHP configuration
; This file contains Laravel-optimized settings

; Note: Most core extensions (ctype, json, mbstring, openssl, pdo, xml, curl, bcmath, zip, intl)
; are already compiled into PHP 8.3 and don't need explicit loading

; Laravel recommended settings
pcre.jit = On
pcre.backtrack_limit = 1000000
pcre.recursion_limit = 100000

; File handling optimizations
file_uploads = On
auto_detect_line_endings = Off

; String settings (simplified for PHP 8.3+)
mbstring.language = neutral

; JSON settings
json.flags = JSON_THROW_ON_ERROR

; Filter settings
filter.default = unsafe_raw
filter.default_flags =

; URL rewriter settings
url_rewriter.tags = "a=href,area=href,frame=src,input=src,form=fakeentry"
url_rewriter.hosts =
