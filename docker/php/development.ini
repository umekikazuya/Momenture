; Development environment PHP configuration

; Basic Settings
memory_limit = -1
max_execution_time = 0
max_input_time = 60
default_socket_timeout = 60

; File Upload Settings
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20

; Session Settings
session.gc_maxlifetime = 1440
session.cache_expire = 180
session.cookie_httponly = On
session.cookie_secure = Off
session.use_strict_mode = On

; Date Settings
date.timezone = Asia/Tokyo

; Configure Opcache for Development
opcache.enable = On
opcache.enable_cli = On
opcache.validate_timestamps = On
opcache.revalidate_freq = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.save_comments = On
opcache.fast_shutdown = On
opcache.file_cache_only = Off
opcache.file_cache_consistency_checks = On

; JIT Configuration for Development
opcache.jit_buffer_size = 32M
opcache.jit = tracing
opcache.jit_hot_loop = 64
opcache.jit_hot_func = 127

; Development specific settings
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
html_errors = On

; Debug Settings
zend.exception_ignore_args = Off
zend.exception_string_param_max_len = 15

; Performance Settings
realpath_cache_size = 4096K
realpath_cache_ttl = 120

; Security Settings (relaxed for development)
expose_php = On
allow_url_fopen = On
allow_url_include = Off

; Output Settings
output_buffering = 4096
implicit_flush = Off

; Variable Settings
variables_order = "GPCS"
request_order = "GP"
auto_globals_jit = On

; Data Handling
arg_separator.output = "&"
arg_separator.input = ";&"
