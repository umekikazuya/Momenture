; ===================================================================
; 20-production.ini - Production Environment Configuration (Priority: 3rd/Highest)
; ===================================================================
; This file OVERRIDES settings from 00-laravel.ini and 10-development.ini 
; for production environment. Provides security-focused, performance-optimized 
; settings with restricted error reporting and resource limits.
;
; Loading order: 00-laravel.ini → 10-development.ini → 20-production.ini
; Final override: This file has the HIGHEST priority and will override
; any conflicting settings from previous files.
;

; Basic Settings
memory_limit = 512M
max_execution_time = 30
max_input_time = 60
default_socket_timeout = 60

; File Upload Settings
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20

; Session Settings
session.gc_maxlifetime = 1440
session.cache_expire = 180
session.cookie_httponly = On
session.cookie_secure = On
session.use_strict_mode = On
session.sid_length = 48
session.sid_bits_per_character = 6

; Date Settings
date.timezone = Asia/Tokyo

; Configure Opcache for Production
opcache.enable = On
opcache.enable_cli = On
opcache.validate_timestamps = Off
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = On
opcache.fast_shutdown = On
opcache.file_cache_only = Off
opcache.file_cache_consistency_checks = Off
opcache.huge_code_pages = On
opcache.preload_user = www-data

; JIT Configuration for Production
opcache.jit_buffer_size = 64M
opcache.jit = tracing
opcache.jit_hot_loop = 64
opcache.jit_hot_func = 127

; Production specific settings
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
html_errors = Off

; Security Settings
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
auto_prepend_file =
auto_append_file =

; Debug Settings (disabled for production)
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; Performance Settings
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Output Settings
output_buffering = 4096
implicit_flush = Off
zlib.output_compression = On
zlib.output_compression_level = 6

; Variable Settings
variables_order = "GPCS"
request_order = "GP"
auto_globals_jit = On

; Data Handling
arg_separator.output = "&"
arg_separator.input = ";&"

; Cloud Run specific optimizations
ignore_user_abort = On
