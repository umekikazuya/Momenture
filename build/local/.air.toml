# Generic .air.toml for Go projects

# .air.toml - Recommended Configuration

# ルートディレクトリと一時ディレクトリの定義
root = "."
tmp_dir = ".tmp"

[build]
  # 実行バイナリのパス
  bin = ".tmp/main"
  # ビルドコマンド
  cmd = "go build -o .tmp/main ./cmd/server"
  # 実行コマンド
  full_bin = "./.tmp/main"
  # ファイル変更後のビルド遅延 (ミリ秒)
  delay = 100
  # 監視対象の拡張子
  include_ext = ["go", "tpl", "tmpl", "html"]
  # 監視から除外するディレクトリ
  exclude_dir = ["assets", ".tmp", "vendor", "docs", "build"]
  # 正規表現で監視から除外 (テストファイルを除外)
  exclude_regex = ["_test.go"]
  # ビルドエラーのログファイル
  log = ".tmp/build-errors.log"
  # ファイル変更検知にポーリングを使用
  poll = false

[log]
  # ログにタイムスタンプを表示
  time = true

[color]
  # ログのカラー設定
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # 終了時に一時ファイルをクリーンアップ
  clean_on_exit = true

[screen]
  # リビルド時に画面をクリア
  clear_on_rebuild = true
  # スクロール位置を維持
  keep_scroll = true