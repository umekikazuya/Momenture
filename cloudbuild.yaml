steps:
  # Docker build
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '-t', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/momenture-api-repo/momenture-api:latest', '.'
    ]

  # Docker push
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/momenture-api-repo/momenture-api:latest'
    ]

  # Cloud Run deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'momenture-api',
      '--image', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/momenture-api-repo/momenture-api:latest',
      '--region', 'asia-northeast1',
      '--platform', 'managed',
      '--port', '80',
      '--allow-unauthenticated',
      '--set-secrets', 'APP_KEY=app_key:latest,DB_HOST=db_host:latest,DB_PORT=db_port:latest,DB_DATABASE=db_database:latest,DB_USERNAME=db_username:latest,DB_PASSWORD=db_password:latest,BASIC_AUTH_USER=basic_auth_user:latest,BASIC_AUTH_PASSWORD=basic_auth_password:latest,AWS_ACCESS_KEY_ID=aws_access_key_id:latest,AWS_SECRET_ACCESS_KEY=aws_secret_access_key:latest,DYNAMODB_ENDPOINT=dynamodb_endpoint:latest',
    ]

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/momenture-api-repo/momenture-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
